# Cấu hình trục. Giao diện web KHÔNG được vượt các giới hạn ở đây;
# tiến trình RT đọc file này lúc khởi động và tự kẹp mọi lệnh.

[bus]
ifname = eth0
cycle_us = 1000

[axis]
# Slave thứ mấy trên bus (bắt đầu từ 1)
slave = 1
# Phải khớp 0x2001 trong driver (DM3E mặc định 50000)
pulses_per_rev = 50000

[limits]
# Tốc độ jog tối đa người dùng chọn được trên web
max_jog_rpm = 300
# Gia tốc / giảm tốc khi jog
accel_rpm_s = 600
# Giảm tốc khi STOP hoặc mất heartbeat (nên >= accel)
stop_decel_rpm_s = 1200

[safety]
# Mất heartbeat từ web quá thời gian này thì trục giảm tốc và dừng
heartbeat_timeout_ms = 200
