# Cấu hình trục. Giao diện web KHÔNG được vượt các giới hạn ở đây;
# tiến trình RT đọc file này lúc khởi động và tự kẹp mọi lệnh.

[bus]
ifname = eth0
cycle_us = 1000

[axis]
# Slave thứ mấy trên bus (bắt đầu từ 1)
slave = 1
# Phải khớp 0x2001 trong driver (DM3E mặc định 50000), không khớp thì không chạy
pulses_per_rev = 50000
# Dòng đỉnh ghi vào 0x2000 mỗi lần cấu hình (chỉ RAM, không lưu EEPROM).
# Motor D57CM31X 5 A, nhưng nguồn hiện chỉ 24 V / 1.5 A.
peak_current_ma = 2000

[limits]
# Tốc độ jog tối đa người dùng chọn được trên web
max_jog_rpm = 120
# Gia tốc / giảm tốc khi jog
accel_rpm_s = 300
# Giảm tốc khi STOP, mất heartbeat hoặc disable (nên >= accel)
stop_decel_rpm_s = 600

[safety]
# Mất heartbeat jog quá thời gian này thì trục giảm tốc và dừng (tối đa 1000)
heartbeat_timeout_ms = 200

[ipc]
# Nhóm được gửi lệnh qua /run/ecat-rt/cmd.sock (web server chạy với nhóm này)
group = vagabond
